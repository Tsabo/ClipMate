name: Build and Test

on:
  push:
    branches: [ master, develop, 'feature/**' ]
    paths:
      - 'Source/**'
      - 'Resources/Fonts/**'
      - 'build/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ master, develop ]

jobs:
  generate-graph:
    name: Generate NuGet Dependency Graph
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Source/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: AddDevExpressLicense
        shell: cmd
        run: |
          set "DEST=%APPDATA%\DevExpress"
          if not exist "%DEST%" mkdir "%DEST%"
          echo "${{ secrets.DEVEXPRESS_LICENSE }}" > %APPDATA%\DevExpress\DevExpress_License.txt

      - name: Add DevExpress NuGet source
        shell: bash
        run: dotnet nuget add source "https://nuget.devexpress.com/${DEVEXPRESS_FEED_AUTH_KEY}/api/v3/index.json" --name "DevExpress Online" --configfile Source/nuget.config
        env:
          DEVEXPRESS_FEED_AUTH_KEY: ${{ secrets.DEVEXPRESS_FEED_AUTH_KEY }}

      - name: Generate graph
        uses: Tsabo/nugraph-action@master
        with:
          project-path: ./Source/ClipMate.sln
          job-summary: 'true'
          dotnet-version: '10.0.x'
          hide-empty-graphs: 'true'
          title: ''
          ignore: |
            DevExpress.*
            Microsoft.*
            System.*

  installer-script:
    name: Compile Installer Script
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Inno Setup
        run: choco install innosetup -y

      # The release build packages the real app; here a stand-in file is enough to check that the script compiles
      - name: Compile ClipMate.iss with a stand-in payload
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'installer-payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          Set-Content -Path (Join-Path $payload 'ClipMate.App.exe') -Value 'stand-in'
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DSourcePath=$payload" '/DMyAppVersion=0.0.0-ci' '/DOutputFilename=ClipMate-Setup-ci' "/O$env:RUNNER_TEMP" build/installer/ClipMate.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

  build:
    name: Build and Test
    runs-on: windows-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Full history for MinVer

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: Source/global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('Source/Directory.Packages.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: AddDevExpressLicense
      shell: cmd
      run: |
        set "DEST=%APPDATA%\DevExpress"
        if not exist "%DEST%" mkdir "%DEST%"
        echo "${{ secrets.DEVEXPRESS_LICENSE }}" > %APPDATA%\DevExpress\DevExpress_License.txt

    - name: Restore .NET tools
      run: dotnet tool restore

    - name: Setup Ninja (for font building)
      run: choco install ninja -y

    - name: Run CI build
      run: dotnet cake build/build.cake --target=CI --verbosity=Normal
      env:
        DEVEXPRESS_FEED_AUTH_KEY: ${{ secrets.DEVEXPRESS_FEED_AUTH_KEY }}
        DevExpress_License: ${{ secrets.DEVEXPRESS_LICENSE }}

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-logs
        path: build/logs/
        retention-days: 30

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results
        path: build/logs/test-results/
        retention-days: 30

    - name: Publish test results
      uses: dorny/test-reporter@v3
      if: always()
      with:
        name: Test Results
        path: build/logs/test-results/**/*.trx
        reporter: dotnet-trx
        fail-on-error: false
