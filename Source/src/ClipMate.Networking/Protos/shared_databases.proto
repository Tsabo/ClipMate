// Read access to a Peer's Shared Databases (ADR 0001: a read-only live proxy).
//
// Every call is coarse and service-level: the requesting Device names what it wants (a Database ID, a collection ID)
// and the Peer runs it against its own Database. No SQL ever crosses the wire, in either direction: Smart and
// SQL-based collections are listed by kind only and their contents are evaluated on the Peer.
//
// Served only to Peers (PairedPeerGate), and only from Databases whose Share with Peers setting is on. Templates,
// shortcuts, application profiles, users, settings and editor state are never served.
syntax = "proto3";

package clipmate.peer.v1;

option csharp_namespace = "ClipMate.Networking.Protocol";

service SharedDatabaseAccess {
  // Lists the Peer's Shared Databases.
  rpc ListSharedDatabases (ListSharedDatabasesRequest) returns (ListSharedDatabasesReply);

  // Returns the collection and folder tree of one Shared Database. NOT_FOUND if the Peer does not share it.
  rpc GetCollectionTree (GetCollectionTreeRequest) returns (GetCollectionTreeReply);

  // Returns one page of the clips (metadata only) of a collection or folder of a Shared Database. Smart and SQL-based
  // collections are evaluated on the Peer with its own stored SQL. NOT_FOUND if the Peer does not share the Database
  // or it has no such collection or folder. Capability "remote-clips".
  rpc GetClipPage (GetClipPageRequest) returns (GetClipPageReply);

  // Returns a clip's metadata and its formats (no content). NOT_FOUND if the Peer does not share the Database or it
  // has no such clip. Capability "remote-clips".
  rpc GetClipFormats (GetClipFormatsRequest) returns (GetClipFormatsReply);

  // Streams the stored content of every format of a clip in chunks, so a large image never needs one huge message.
  // Encrypted clips are streamed as stored (ciphertext); the Peer never decrypts. Capability "remote-clips".
  rpc ReadClipContent (ReadClipContentRequest) returns (stream ClipContentChunk);

  // Streams lightweight change notices for the Peer's Shared Databases for as long as the call stays open: which
  // collection changed (a clip captured, deleted, moved or edited, or the collection itself changed), and when the
  // list of Shared Databases changed. Notices carry IDs only, never clip data; the requesting Device re-fetches what it
  // shows. Databases that are not shared produce no notices. The Peer sends the response headers as soon as it is
  // listening. Capability "change-notifications".
  rpc WatchChanges (WatchChangesRequest) returns (stream ChangeNotice);
}

message ListSharedDatabasesRequest {
}

message ListSharedDatabasesReply {
  repeated SharedDatabaseInfo databases = 1;
}

message SharedDatabaseInfo {
  // The permanent Database ID (GUID, "D" format).
  string database_id = 1;
  string name = 2;
}

message GetCollectionTreeRequest {
  string database_id = 1;
}

message GetCollectionTreeReply {
  // Flat list; the tree is given by parent_id.
  repeated CollectionEntry collections = 1;
}

enum CollectionKind {
  COLLECTION_KIND_UNSPECIFIED = 0;
  COLLECTION_KIND_COLLECTION = 1;
  COLLECTION_KIND_FOLDER = 2;
  COLLECTION_KIND_SMART = 3;
  COLLECTION_KIND_SQL_BASED = 4;
}

message CollectionEntry {
  // GUID, "D" format.
  string id = 1;
  // GUID of the collection or folder this entry belongs to; empty for a top-level entry.
  string parent_id = 2;
  string title = 3;
  CollectionKind kind = 4;
  int32 sort_key = 5;
}

message GetClipPageRequest {
  string database_id = 1;
  string collection_id = 2;
  // Empty for the collection itself.
  string folder_id = 3;
  int32 offset = 4;
  // The Peer serves at most its own page size limit.
  int32 count = 5;
}

message GetClipPageReply {
  repeated ClipSummary clips = 1;
  int32 offset = 2;
  int32 total_count = 3;
}

enum ClipKind {
  CLIP_KIND_UNSPECIFIED = 0;
  CLIP_KIND_TEXT = 1;
  CLIP_KIND_IMAGE = 2;
  CLIP_KIND_FILES = 3;
  CLIP_KIND_RICH_TEXT = 4;
  CLIP_KIND_HTML = 5;
  CLIP_KIND_CUSTOM = 6;
}

// A clip's metadata, as shown in a clip list. Carries no content.
message ClipSummary {
  string id = 1;
  string title = 2;
  // Capture time in Unix milliseconds (UTC), and the UTC offset in minutes it was captured with.
  int64 captured_at_unix_ms = 3;
  int32 captured_at_offset_minutes = 4;
  int32 size = 5;
  ClipKind kind = 6;
  bool has_text = 7;
  bool has_rtf = 8;
  bool has_html = 9;
  bool has_bitmap = 10;
  bool has_files = 11;
  string source_application_name = 12;
  string source_application_title = 13;
  string source_url = 14;
  string creator = 15;
  bool custom_title = 16;
  bool macro = 17;
  int32 sort_key = 18;
  // Encryption metadata (never a key): encrypted clips are decrypted only by the requesting Device.
  bool encrypted = 19;
  string encryption_salt = 20;
  string encryption_iv = 21;
  string encryption_method = 22;
  string collection_id = 23;
  string folder_id = 24;
}

message GetClipFormatsRequest {
  string database_id = 1;
  string clip_id = 2;
}

message GetClipFormatsReply {
  ClipSummary clip = 1;
  repeated ClipFormat formats = 2;
}

message ClipFormat {
  string id = 1;
  int32 format = 2;
  string format_name = 3;
  // Which store holds the content: 1 text, 2 JPEG, 3 PNG, 4 binary.
  int32 storage_type = 4;
  int32 size = 5;
}

message ReadClipContentRequest {
  string database_id = 1;
  string clip_id = 2;
}

// One piece of one format's stored content. The pieces of a format arrive in order and together; text is UTF-8.
message ClipContentChunk {
  string format_id = 1;
  int32 storage_type = 2;
  bytes data = 3;
  // The total length of this format's content, so the receiver can allocate once and check it.
  int64 total_length = 4;
}

message WatchChangesRequest {
}

message ChangeNotice {
  oneof change {
    CollectionChanged collection_changed = 1;
    SharedDatabasesChanged shared_databases_changed = 2;
  }
}

// A collection or folder of a Shared Database changed.
message CollectionChanged {
  // GUID, "D" format.
  string database_id = 1;
  // GUID, "D" format.
  string collection_id = 2;
}

// A Database was shared or unshared, or a Shared Database was renamed: ask ListSharedDatabases again.
message SharedDatabasesChanged {
}
